- project: Pendle
  metric: locked_tokens_dashboard
  tier: 3
  enabled: true
  # RE-POINTED 2026-09-28 at Pendle's DOCUMENTED data endpoint, as the old note asked. The hub
  # page (app.pendle.finance/spendle/stake/in) is disallowed by robots.txt and its "Total Staked"
  # is the >100M figure — sPENDLE + legacy vePENDLE, or the virtual boost balance — not PENDLE
  # locked in sPENDLE. Source: Pendle's API docs, docs/pendle-dev-docs/Backend/ApiOverview.mdx
  # (pendle-finance/documentation @ 9b9509e, 2026-09-23): GET /v1/spendle/data under
  # https://api-v2.pendle.finance/core, 1 CU, cached 5 min, no parameters. Fields:
  # totalPendleStaked ("Total PENDLE currently staked"), totalStakedInSpendle ("Total staked in
  # the sPENDLE contract"), virtualSpendleFromVependle. totalStakedInSpendle is the like-for-like
  # figure for locked_tokens = PENDLE.balanceOf(sPENDLE).
  # Loaded directly: the xhr method captures every JSON response, the navigation included.
  url: https://api-v2.pendle.finance/core/v1/spendle/data
  method: json            # plain GET (2026-09-28): the xhr/Chromium route stored nothing and said nothing
  url_contains: /v1/spendle/data
  json_path: totalStakedInSpendle
  decimals: 18            # wei — see units_source (2026-09-28)
  units_source: "Pendle's API docs (ApiOverview.mdx @ 9b9509e) do not state units; the amounts are raw wei (18 = PENDLE/sPENDLE decimals): open-source consumers divide by 1e18 (HarukiShirato/real-time-monitoring-for-perpetual-contracts scripts/staking-collector.js), Shaurya477/spendle-tracker matches totalStakedInSpendle to sPENDLE.totalSupply() exactly, and the live 3.034133782977e25 / 1e18 = 30,341,337.8 matches totalSupply 30,340,254.46 to 0.004%"
  needs_first_run_check: true
  sanity_min: 1000
  sanity_max: 300000000
  change_threshold_pct: 25
  added: 2026-09-11
  note: "SETTLED 2026-09-28: the field is sPENDLE SHARES in wei — 3.034133782977e25 / 1e18 = 30,341,337.8 against sPENDLE.totalSupply() 30,340,254.46 (0.004%), so it is cross-checked against locked_tokens_shares, not locked_tokens (35.42M, which also holds the unstake queue). totalPendleStaked is the wider figure and is NOT this metric. Cross-check only: the tier 2 read stays primary."

- project: Pendle
  metric: locked_tokens_virtual
  tier: 3
  enabled: true
  # Added 2026-09-28 (Jake): the virtual sPENDLE balance legacy vePENDLE holders received, which
  # shares in distributions and so belongs in the protocol-yield denominator. Same documented
  # endpoint as locked_tokens_dashboard above (Pendle API docs, ApiOverview.mdx @ 9b9509e).
  url: https://api-v2.pendle.finance/core/v1/spendle/data
  method: json            # plain GET (2026-09-28): the xhr/Chromium route stored nothing and said nothing
  url_contains: /v1/spendle/data
  json_path: virtualSpendleFromVependle
  decimals: 18            # wei — see units_source (2026-09-28)
  units_source: "Pendle's API docs (ApiOverview.mdx @ 9b9509e) do not state units; the amounts are raw wei (18 = PENDLE/sPENDLE decimals): open-source consumers divide by 1e18 (HarukiShirato/real-time-monitoring-for-perpetual-contracts scripts/staking-collector.js), Shaurya477/spendle-tracker matches totalStakedInSpendle to sPENDLE.totalSupply() exactly, and the live 3.034133782977e25 / 1e18 = 30,341,337.8 matches totalSupply 30,340,254.46 to 0.004%"
  needs_first_run_check: true
  sanity_min: 0
  sanity_max: 1000000000
  change_threshold_pct: 25
  added: 2026-09-28
  note: "In wei (decimals 18). Expect ~1.78e26 raw = ~177.8M virtual sPENDLE: spendle-tracker read 177,778,397.73 on-chain vs 177,778,738.43 from this API on 2026-09-11. Used only as a denominator input to Pendle's protocol yield (added 1:1 to sPENDLE shares); never summed into locked_tokens."

