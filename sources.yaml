# Aerodrome locked_tokens_dashboard — CLOSED 2026-09-12, entry REMOVED rather than left disabled.
# The cross-check on veAERO locked has no route: dune.com robots.txt disallows scraping this
# dashboard, and the underlying query 2986047 is unusable (API 404 indistinguishable from a
# control id that does not exist; browser, signed in: "This query is private or doesn't exist").
