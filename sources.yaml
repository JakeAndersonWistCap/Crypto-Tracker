# =====================================================================================
# sources.yaml — the source registry.
#
# THIS FILE IS THE HANDOFF POINT. Adding a source is a YAML edit; no Python.
# Every page you currently visit by hand and read a number off belongs here.
#
# The Gap Report tab in token_metrics.xlsx lists every metric still unresolved and why.
# Work from that tab: find the page that publishes the figure, add or complete the entry
# below, set `enabled: true`, and re-run `python token_metrics.py`.
#
# -------------------------------------------------------------------------------------
# FIELDS
#
#   project   (required)  Exact project name from config.py.
#   metric    (required)  Metric key from config.METRICS.
#   tier      (required)  3 = the protocol's own dashboard. 5 = off-chain operational
#                         (node counts, utilisation, customer revenue). Informational —
#                         both take the same path.
#   url       (required)  The page to load.
#   method    (required)  xhr | dom | adapter
#   enabled               false (default for stubs) keeps the entry out of the run while
#                         still listing it in the Gap Report. Set true once complete.
#
#   -- method: xhr  (PREFERRED — far more stable than DOM selectors)
#   url_contains          Substring identifying the JSON endpoint the page calls on load.
#                         Find it in your browser: DevTools -> Network -> Fetch/XHR.
#   json_path             Dotted path into that JSON: "data.stats.0.totalBurned".
#                         List indices are numbers: "items.0.value".
#
#   -- method: dom  (fallback, when there is no clean endpoint)
#   anchor                The LABEL TEXT to anchor on, e.g. "Total CAKE Burned".
#                         NEVER a positional selector. The extractor finds the element
#                         whose text matches this label and reads the number beside it,
#                         so the entry survives a redesign that moves the element.
#
#   -- method: adapter  (last resort, for a page that genuinely needs bespoke handling)
#   adapter               Module name under adapters/, exposing extract(page, entry).
#
#   -- optional, any method
#   scale                 Multiply the extracted number by this (e.g. 1000000 if the page
#                         shows millions). Default 1.
#   cumulative            true if the figure is a running total rather than a period flow.
#   derive_flow_metric    With cumulative: true, also store the period flow into this
#                         metric by differencing against the last stored value.
#                         e.g. metric: burn_address_balance + derive_flow_metric:
#                         gross_burn_tokens.
#   wait_for              CSS selector to wait for before extracting, if the page is slow.
#   wait_until            load | domcontentloaded | networkidle (default networkidle).
#   sanity_min/max        Override the metric's default plausibility bounds. A value
#                         outside them is REJECTED and sent to the Review Queue.
#   change_threshold_pct  Override the default. A move larger than this is stored but
#                         FLAGGED to the Review Queue. Default 50.
#   added                 Date you added the entry. For your own audit trail.
#   note                  Anything a future reader needs to know.
#
# -------------------------------------------------------------------------------------
# ANTI-BRITTLENESS
#
# The dangerous failure is not the site going down, which is obvious. It is a redesign
# where the selector still matches but now points at a different number. Three defences,
# all active:
#   1. Anchor on label text, never on position   (the `anchor` field)
#   2. Sanity bounds per metric                  (rejected, not stored)
#   3. Change threshold                          (stored but flagged for review)
#
# POLITENESS: one run a day, responses cached per day, robots.txt respected, and the user
# agent identifies the tool honestly.
# =====================================================================================

# -------------------------------------------------------------------------------------
# WORKED EXAMPLES — templates, not live sources. example.com is deliberately fictional.
# Copy the shape, not the URL.
# -------------------------------------------------------------------------------------

