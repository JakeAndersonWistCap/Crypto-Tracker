# -------------------------------------------------------------------------------------
# STUBS — one per metric the Gap Report cannot resolve any other way.
# Fill in `url` (and `url_contains` + `json_path`, or `anchor`), then set `enabled: true`.
# -------------------------------------------------------------------------------------

# ---- Bitcoin (BTC) — archetypes 1
# ---- Ethereum (ETH) — archetypes 1, 4
# =====================================================================================
# ULTRASOUND.MONEY — the only end-to-end cross-check this tool has for ANY chain.
#
# It publishes issuance, burn AND net supply change for Ethereum: the exact three
# figures this tool otherwise DERIVES. Every other project gives us one side and we
# compute the rest; here the whole derivation can be checked against a published
# answer. That is why these three entries are grouped and commented together rather
# than left among the per-project stubs.
#
# STATUS, REWRITTEN 2026-09-18 after reading ultrasoundmoney/frontend's own source on
# GitHub (raw.githubusercontent.com — reachable from this sandbox; github.com HTML,
# codeload.github.com and api.github.com are all NOT, so the repo was read file-by-file
# by guessing paths under src/mainsite/api/). This REPLACES the 2026-09-15 status note
# below, which guessed at an endpoint from DevTools; this one is read from the code.
#
# THE REAL API SURFACE, confirmed from source:
#   /api/fees/grouped-analysis-1   -> feesBurned.feesBurned30d (and variants) — BURN,
#     a WeiNumber (scale by 1e-18 for ETH). A sibling feesBurned30dUsd field exists —
#     that is the USD figure and must NOT be used for a token-flow metric.
#   /api/v2/fees/supply-parts      -> executionBalancesSum + beaconBalancesSum -
#     beaconDepositsSum — TOTAL SUPPLY. Matches this tool's own already-documented
#     formula for Ethereum supply exactly. Confirms the formula, not just the figure.
#   /api/v2/fees/supply-over-time  -> a supply time series.
#   /api/fees/scarcity             -> engines.burned.amount — a cumulative-burn
#     cross-check, separate from the 30d figure above.
#
# ** ISSUANCE HAS NO RAW FIELD, ANYWHERE. ** Read src/mainsite/api/supply-changes.ts:
# ultrasound.money computes issuance CLIENT-SIDE via delta(total_supply) + burn — the
# IDENTICAL formula this tool already uses for its own derived issuance. So there is no
# endpoint to point gross_issuance_tokens or net_mint_monthly at: filling in
# url_contains/json_path for either would be inventing a source, not finding one. This
# is a genuine methodological finding, not a gap — ultrasound.money's issuance figure
# would never be an INDEPENDENT check on ours, because it is the same computation run
# twice. Both entries below are re-characterised accordingly, not simply filled in.
#
# ** WHY FILLING IN THE KNOWN BURN ENDPOINT STILL WILL NOT ENABLE IT. ** Checked
# fetch/scrape.py's _scrape_one(): robots_allows(url) is evaluated against entry["url"]
# — the PAGE loaded via Playwright's page.goto() — for EVERY method, dom AND xhr alike.
# xhr interception only works because Playwright has already loaded and executed the
# page's JS; there is no code path that fetches an API URL directly without first
# loading the page it is embedded in. So all three entries share one robots.txt
# dependency: https://ultrasound.money/ itself, regardless of which API path the data
# actually comes from. The user's hypothesis this round — that an API sub-path might be
# permitted where the root page is not — cannot be tested under this architecture: it
# would need a genuinely new direct-HTTP-fetch mechanism outside the existing
# Playwright-based sources.yaml scraper, robots-checked against the API path
# specifically rather than the page. THAT IS A NEW MECHANISM, not built here — flagged
# per this project's standing rule (fix the specific thing, say so in one line and wait
# before adding new general tooling) rather than built unilaterally.
#
# RE-CONFIRMED 2026-09-21, against the audit's question — "is the API path also disallowed,
# or is the scraper still pointed at the root URL?" IT IS THE SECOND, and not as an
# oversight: fetch/scrape.py's _scrape_one() calls robots_allows(entry["url"]) as its first
# act, and entry["url"] for all three ultrasound entries is the root page, which is what
# Playwright loads even when the figure is captured from an XHR. The run log reading
# "https://ultrasound.money/" is therefore correct and expected — that IS the URL being
# checked, whatever path the data would have come from.
# ** SO THE API PATH'S OWN robots.txt STATUS IS NEVER CONSULTED, and remains unknown. ** It
# cannot be consulted without the direct-fetch mechanism described above, and it could not be
# checked by hand from this session either: ultrasound.money is unreachable from this sandbox
# (robots.txt fetch returned no response at all), so no claim is made about what it permits.
#
# ROBOTS.TXT ITSELF remains not independently verified from this sandbox: both curl and
# the WebFetch tool return a deliberate proxy-level block (curl: "CONNECT tunnel failed,
# response 403"; WebFetch: structured error_type EGRESS_BLOCKED) for ultrasound.money on
# EVERY path tried, including /robots.txt itself — this is a network-level refusal, not
# an application-layer robots rule, so even the root page's ACTUAL robots.txt content is
# unconfirmed from here. THE LIVE RUN OF 2026-09-17/18 CONFIRMS THE PRACTICAL OUTCOME
# ANYWAY: the total_supply_dashboard entry below (enabled: true) failed that run on
# robots.txt disallowing https://ultrasound.money/ — so whatever the sandbox cannot
# read, the scraper's own live check already answered empirically for the page root.
#
# 2026-09-15 STATUS NOTE, KEPT FOR HISTORY, NOW SUPERSEDED BY THE ABOVE: total supply
# was believed reachable because it is server-rendered (present in the initial HTML, no
# JS needed) while burn and issuance carry a client-hydrated "0K ETH/year" placeholder
# in the raw HTML — true as a description of WHAT the page contains, but irrelevant to
# WHETHER robots.txt allows fetching it, which is a separate question this note did not
# address and the live run has since answered: no, for the whole page.
#
# NOTE THE UNITS TRAP if burn is ever enabled: ultrasound.money presents figures both
# per period and annualised, and both in ETH and in USD. gross_burn_tokens is a TOKEN
# flow. Take feesBurned30d (ETH, WeiNumber), never feesBurned30dUsd.
# =====================================================================================
- project: Ethereum
  metric: total_supply_dashboard
  tier: 3
  enabled: false            # PARKED 2026-09-28 (Jake) — see the note's first paragraph.
  url: "https://ultrasound.money/"
  method: dom
  anchor: "Total supply"
  sanity_min: 100000000
  sanity_max: 140000000
  change_threshold_pct: 5
  added: 2026-09-15
  note: >-
    PARKED 2026-09-28 (Jake): disabled, no longer attempted each run. robots.txt still
    disallows the page, and a cross-check that can only ever report "blocked" is noise on the
    Run Log. The entry stays as the record of the page and its JSON route below.

    CONFIRMED BROKEN ON A LIVE RUN, 2026-09-17/18: failed on robots.txt disallowing
    https://ultrasound.money/. Left enabled anyway, same precedent as Pendle's
    locked_tokens_dashboard below — the robots check runs before any page load and costs
    nothing, and an enabled-but-blocked entry keeps the Gap Report naming the accurate reason
    rather than going silent. Do NOT work around this; robots.txt is respected, not routed
    around.

    Once/if this is ever reachable: the underlying figure is also available as JSON at
    /api/v2/fees/supply-parts (executionBalancesSum + beaconBalancesSum - beaconDepositsSum),
    which matches this tool's own documented Ethereum supply formula exactly — confirmed by
    reading ultrasoundmoney/frontend's own source, 2026-09-18. Switching method to xhr and
    pointing at that endpoint would NOT fix the robots.txt failure: robots_allows() is checked
    against this entry's `url` (the page Playwright loads) for every method, dom or xhr alike,
    because xhr interception requires the page's JS to already be running. The block is on the
    page, not the anchor or the method.

    ** THE ANCHOR IS 'Total supply', NOT 'EVM balances'. ** The page shows the total beside its
    three components (EVM balances 167,722,332.48 + beacon balances 43,388,015.76 - beacon
    deposits 89,067,206.25 = 122,043,141.99), and anchoring on a COMPONENT label would store
    167,722,332.48 as Ethereum's supply — 37.4% high, and high in a way that passes the generic
    total_supply bounds of 0..1e15 and renders as ok. The sanity_min/max above are set around the
    real figure rather than around what is physically possible, so a mis-anchor fails loudly at
    the sanity gate instead of storing a plausible overstatement.

    CROSS-CHECK ONLY, never a replacement — config declares it against tier 1 CoinGecko with a 1%
    tolerance. The two agreed to 0.00575% when last checked (2026-09-15, before the robots.txt
    failure).
- project: Ethereum
  metric: gross_issuance_tokens
  tier: 3
  enabled: false
  url: "https://ultrasound.money/"
  method: xhr
  url_contains: null                                # RE-CHARACTERISED 2026-09-18 — see note. No endpoint exists.
  json_path: null
  added: 2026-09-15
  note: "** CLOSED PERMANENTLY 2026-09-22 — see config.py UNAVAILABLE (Ethereum/gross_issuance_tokens). ultrasound.money has NO issuance endpoint and never did: its frontend computes issuance client-side as delta(total_supply) + burn, the identical formula this tool uses, so the figure would not be an independent check — it would be our own computation run twice, reading as corroboration. Re-pointing this at /api/fees/grouped-analysis-1, the alternative offered this round, would have pointed an issuance metric at a burn figure. The entry is kept, disabled and closed, rather than deleted: the finding is the valuable part. THE BURN ENTRY IS NOT CLOSED WITH IT — feesBurned is a real independently measured figure blocked only on robots and reachability, which can change, where these two are blocked on arithmetic, which cannot. ORIGINAL NOTE FOLLOWS. RE-CHARACTERISED 2026-09-18, not merely still-TODO: read ultrasoundmoney/frontend's own
    source (src/mainsite/api/supply-changes.ts) and confirmed there is NO raw issuance field
    anywhere in their API. ultrasound.money computes issuance CLIENT-SIDE via
    delta(total_supply) + burn — the IDENTICAL formula this tool already uses for its own
    derived figure. So this would never be an independent cross-check even if it were
    reachable: it is the same computation, run twice. Left disabled and NOT filled in — there is
    no endpoint to fill in. If a genuine independent issuance source ever surfaces (e.g. a
    consensus-layer-specific validator-rewards feed), replace this entry rather than repurpose
