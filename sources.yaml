# =====================================================================================
# LOCK RATES AND STAKING — supplied as PAGES, so these are tier 3/4 registry entries
# rather than contract reads. ENABLED.
#
# HONESTY NOTE ON THESE SIX ENTRIES: they are enabled as instructed, but the
# `url_contains`, `json_path` and `anchor` values below were INFERRED without sight of
# the pages, because the machine that wrote them has no network access. Each therefore
# carries `needs_first_run_check: true`, which puts its first returned value in the
# Review Queue. Eyeball each against the page once, correct the anchor or json_path if
# it is wrong, then delete the flag. Tight sanity bounds are set on each so a wrong
# match is very likely rejected rather than stored.
#
# FOR THE TWO DUNE DASHBOARD PAGES: scraping a Dune dashboard works but is the fragile
# route. The robust one is the Dune API with the query id behind the dashboard — open
# the dashboard, take the query id, and put it in config.py under the project's
# dune_queries. Do that when you have a moment and delete the scrape entry.
# =====================================================================================

- project: Aerodrome
  metric: locked_tokens
  tier: 4
  enabled: true
  url: https://dune.com/0xkhmer/aerodrome
  method: xhr
  url_contains: /api/
  json_path: result.rows.0.locked_aero
  anchor: "veAERO"
  needs_first_run_check: true
  sanity_min: 1000000
  sanity_max: 2000000000
  change_threshold_pct: 25
  added: 2026-09-11
  note: "veAERO locked — the lock rate and average lock duration are required inputs for effective float. Prefer the Dune API with this dashboard's query id over scraping the page."

- project: Pendle
  metric: staked_tokens
  tier: 3
  enabled: true
  url: https://app.pendle.finance/spendle/stake/in
  method: xhr
  url_contains: /api/
  json_path: totalStaked
  anchor: "Total Staked"
  needs_first_run_check: true
  sanity_min: 1000
  sanity_max: 300000000
  change_threshold_pct: 25
  added: 2026-09-11
  note: "sPENDLE total staked. NOTE this is sPENDLE, which is NOT the same as the vePENDLE lock — vePENDLE stays a separate contract read under locked_tokens. Do not conflate them."

- project: Sky
  metric: locked_tokens
  tier: 3
  enabled: true
  url: https://info.skyeco.com/staking
  method: xhr
  url_contains: /api/
  json_path: totalStaked
  anchor: "Total SKY Staked"
  needs_first_run_check: true
  sanity_min: 1000000
  sanity_max: 30000000000
  change_threshold_pct: 25
  added: 2026-09-11
  note: "This page reports lssky, the Staked SKY Token, which IS the Sky lock-rate metric — hence locked_tokens rather than staked_tokens. Tokens paid to stakers re-enter float, so that leg stays separate and is NEVER netted against the burn. Once the lssky contract address is sourced, prefer the tier 2 contract read over this page."

- project: Ether.fi
  metric: staked_tokens
  tier: 4
  enabled: true
  url: https://dune.com/ether_fi/staked-ethfi
  method: xhr
  url_contains: /api/
  json_path: result.rows.0.staked_ethfi
  anchor: "Staked ETHFI"
  needs_first_run_check: true
  sanity_min: 1000
  sanity_max: 2000000000
  change_threshold_pct: 25
  added: 2026-09-11
  note: "Staked ETHFI. Prefer the Dune API with this dashboard's query id over scraping the page."

# ---- Aave: the two pages are NOT parallel. This was a correction, verified against Aave's docs.
#   app.aave.com/safety-module  = the LEGACY Safety Module. AAVE and ABPT staked on Ethereum,
#                                 producing stkAAVE and stkABPT. THIS is the AAVE lock rate.
#   app.aave.com/staking        = UMBRELLA. Stakes aTokens (aUSDC, aUSDT, aWETH) and GHO, NOT
#                                 AAVE. It tells you nothing about AAVE float, so it is NOT stored
#                                 as an AAVE staked or lock figure under any label — it is a
#                                 separate protocol-risk measure in dollars, excluded from every
#                                 supply and float calculation.
#   Sources: https://aave.com/docs/aave-v3/umbrella and https://app.aave.com/safety-module/

- project: Aave
  metric: locked_tokens
  tier: 3
  enabled: true
  url: https://app.aave.com/safety-module/
  method: xhr
  url_contains: /api/
  json_path: stakedTotal
  anchor: "Staked AAVE"
  needs_first_run_check: true
  sanity_min: 1000
