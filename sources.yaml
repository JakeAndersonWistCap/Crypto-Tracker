# ---- Aave: the two pages are NOT parallel. This was a correction, verified against Aave's docs.
#   app.aave.com/safety-module  = the LEGACY Safety Module. AAVE and ABPT staked on Ethereum,
#                                 producing stkAAVE and stkABPT. THIS is the AAVE lock rate.
#   app.aave.com/staking        = UMBRELLA. Stakes aTokens (aUSDC, aUSDT, aWETH) and GHO, NOT
#                                 AAVE. It tells you nothing about AAVE float, so it is NOT stored
#                                 as an AAVE staked or lock figure under any label — it is a
#                                 separate protocol-risk measure in dollars, excluded from every
#                                 supply and float calculation.
#   Sources: https://aave.com/docs/aave-v3/umbrella and https://app.aave.com/safety-module/

- project: Aave
  metric: locked_tokens_dashboard
  tier: 3
  enabled: true
  url: https://app.aave.com/safety-module/
  method: xhr
  url_contains: /api/
  json_path: stakedTotal
  anchor: "Staked AAVE"
  needs_first_run_check: true
  sanity_min: 1000
  sanity_max: 20000000
  change_threshold_pct: 25
  added: 2026-09-11
  note: "THE AAVE lock rate — the legacy Safety Module, where AAVE and ABPT are staked into stkAAVE and stkABPT. This is AAVE, so it belongs in the float calculation. CROSS-CHECK slot: once the stkAAVE read method is established the tier 2 read becomes authoritative and this page is compared against it."

- project: Aave
  metric: umbrella_staked_usd
  tier: 3
  enabled: true
  url: https://app.aave.com/staking/?marketName=proto_mainnet_v3
  method: xhr
  url_contains: /api/
  json_path: totalStakedUsd
  anchor: "Total staked"
  needs_first_run_check: true
  sanity_min: 0
  sanity_max: 100000000000
  change_threshold_pct: 40
  added: 2026-09-11
  note: "UMBRELLA — stakes aTokens (aUSDC, aUSDT, aWETH) and GHO, NOT AAVE. Protocol-risk cover measured in dollars. It has NO bearing on AAVE supply or float and must never be summed with the Safety Module figure or labelled as AAVE staked."


